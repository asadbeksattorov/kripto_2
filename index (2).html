{id:'gost',name:'GOST 28147-89',icon:'🇷🇺',kw:[[/gost[ -]?28147/,6],[/gammalashtirish/,4],[/asosiy qadam|32-z/,4]]},
{id:'aes',name:'AES (Rijndael)',icon:'🛡️',kw:[[/\baes\b|aes-128/,6],[/rijndael/,4],[/subbytes|shiftrows|mixcolumns|addroundkey/,5]]},
{id:'rsa',name:'RSA algoritmi',icon:'🔑',kw:[[/\brsa\b/,6],[/eyler|φ\(n\)/,3],[/ochiq kalit (\{|e\b)/,3]]},
{id:'asym',name:'Asimmetrik tizimlar (El-Gamal, ECC, DH)',icon:'🔐',kw:[[/el-?gamal/,6],[/diffi|diffie/,4],[/elliptik/,6],[/ochiq kalitli/,5],[/asimmetrik/,5],[/maxfiy eshik/,4],[/gibrid/,4],[/bir tomonlama/,3]]},
{id:'hash',name:'Xesh funksiyalar (MD5, SHA)',icon:'#️⃣',kw:[[/xesh/,5],[/\bmd5\b/,6],[/\bsha-?\d*/,4],[/gost (r )?34\.11/,4],[/kolliz/,3]]},
{id:'eri',name:'Elektron raqamli imzo (ERI)',icon:'✍️',kw:[[/\beri/,6],[/imzo|elektron raqamli/,4],[/\bdss\b|\becdsa\b|\bdsa\b/,4],[/gost (r )?34\.10/,5],[/o'zdst 1092/,6]]},
{id:'key',name:'Kalitlar boshqaruvi',icon:'🗝️',kw:[[/kalitlarni/,2],[/seans/,4],[/kerberos/,5],[/x9\.17/,5],[/tarqatish/,2],[/kalit uzunligi/,2],[/generatsiya/,2],[/protokol/,3]]}
];
const OTHER={id:'other',name:'Boshqa',icon:'📦'};
function nrm(s){return s.toLowerCase().replace(/[’ʻʼ`‘]/g,"'")}
function classify(q,ans){
  const a=nrm(q),b=nrm(ans),sc={};let best=0,top='';
  for(const c of CATS){let s=0;for(const [re,w] of c.kw){if(re.test(a))s+=w*3;if(re.test(b))s+=w*1.5}
    sc[c.id]=s;if(s>best){best=s;top=c.id}}
  if(!best)return [OTHER.id];
  const out=CATS.filter(c=>c.id!=='base'&&sc[c.id]>=Math.max(9,best*0.5)).map(c=>c.id);
  if(top==='base'&&!out.length)return ['base'];
  return out.length?out:[top];
}



const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let Q=[],ById={},stats={},prefs={theme:null,mode:'topics',topic:'all',random:true,onlyBad:false};
let S={fc:null,quiz:null};
const ALL=[...CATS,OTHER],CatBy=Object.fromEntries(ALL.map(c=>[c.id,c]));

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function djb(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const mk=(q,opts,c)=>({id:djb(q+'|'+opts[c]),q,opts,c,cats:classify(q,opts[c])});

function parse(text){
  const list=[];let skipped=0;
  text.replace(/\r/g,'').split('+++').filter(b=>b.includes('===')).forEach(b=>{
    const arr=b.split('===').map(x=>x.trim());
    const q=arr[0],raw=arr.slice(1).filter(Boolean);
    if(!q||raw.length<2||raw.filter(o=>o.startsWith('#')).length!==1){skipped++;return}
    const c=raw.findIndex(o=>o.startsWith('#'));
    list.push(mk(q,raw.map(o=>o.replace(/^#\s*/,'')),c));
  });
  return {list,skipped};
}
function save(){LS.set('kq_stats',stats)}
function savePrefs(){LS.set('kq_prefs',prefs)}
function setQ(list){Q=list;ById={};Q.forEach(x=>ById[x.id]=x);LS.set('kq_data',Q.map(x=>({q:x.q,o:x.opts,c:x.c})));$('#count').textContent=Q.length;$('#ncat').textContent=topicList().length;fillSel()}
function record(id,ok){const st=stats[id]||(stats[id]={a:0,c:0,last:null});st.a++;if(ok)st.c++;st.last=ok?'ok':'bad';save()}
const isBad=x=>stats[x.id]&&stats[x.id].last==='bad';
const isOk=x=>stats[x.id]&&stats[x.id].last==='ok';
function topicList(){return ALL.map(c=>({c,items:Q.filter(x=>x.cats.includes(c.id))})).filter(t=>t.items.length)}
const topicName=id=>id==='all'?'Barcha savollar':(CatBy[id]?CatBy[id].name:'');

function fillSel(){
  const sel=$('#topicSel');
  sel.innerHTML=`<option value="all">📚 Barcha mavzular (${Q.length})</option>`+topicList().map(t=>`<option value="${t.c.id}">${t.c.icon} ${esc(t.c.name)} (${t.items.length})</option>`).join('');
  if(prefs.topic!=='all'&&!Q.some(x=>x.cats.includes(prefs.topic)))prefs.topic='all';
  sel.value=prefs.topic;
}
function start(m,topic){
  if(topic!==undefined){prefs.topic=topic;$('#topicSel').value=topic;savePrefs()}
  let pool=Q.filter(x=>(prefs.topic==='all'||x.cats.includes(prefs.topic))&&(!prefs.onlyBad||isBad(x)));
  let ids=pool.map(x=>x.id);if(prefs.random)shuffle(ids);
  S[m]={queue:ids,total:ids.length,done:0,ok:0,bad:0,flipped:false,sel:null,order:null};
  if(m==='quiz')prepQ(S[m]);
}
function prepQ(s){if(s.queue.length){s.order=shuffle(ById[s.queue[0]].opts.map((_,i)=>i));s.sel=null}}

function applyTheme(){
  const dark=prefs.theme?prefs.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark',dark);
  $('#themeBtn').textContent=dark?'☀️':'🌙';
}
function renderStats(){
  let A=0,C=0,solved=0;
  Q.forEach(x=>{const s=stats[x.id];if(s&&s.a>0){solved++;A+=s.a;C+=s.c}});
  $('#stSolved').textContent=solved+' / '+Q.length;
  $('#stAcc').textContent=(A?Math.round(C/A*100):0)+'%';
  $('#stBad').textContent=Q.filter(isBad).length;
  const s=S[prefs.mode];let pct,label;
  if(prefs.mode!=='topics'&&s&&s.total){pct=s.done/s.total*100;label='Sessiya: '+s.done+' / '+s.total+' · '+topicName(prefs.topic)}
  else{const ok=Q.filter(isOk).length;pct=Q.length?ok/Q.length*100:0;label='O’zlashtirilgan: '+ok+' / '+Q.length}
  $('#bar').style.width=pct+'%';$('#barLabel').textContent=label;$('#barPct').textContent=Math.round(pct)+'%';
}
function render(){
  const m=prefs.mode;
  document.querySelectorAll('.tab').forEach(t=>{
    const on=t.dataset.mode===m;
    t.className='tab py-2 rounded-xl text-sm font-semibold '+(on?'bg-white dark:bg-slate-700 shadow text-indigo-600 dark:text-indigo-300':'text-slate-600 dark:text-slate-400');
  });
  $('#toolbar').classList.toggle('hidden',m==='topics');
  $('#rnd').checked=prefs.random;$('#onlyBad').checked=prefs.onlyBad;$('#topicSel').value=prefs.topic;
  renderStats();
  if(m==='fc')renderFC();else if(m==='quiz')renderQuiz();else renderTopics();
}

const cardCls='rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm';

function topicCard(id,icon,name,items){
  const n=items.length,ok=items.filter(isOk).length,bad=items.filter(isBad).length,pct=n?Math.round(ok/n*100):0;
  const sel=prefs.topic===id;
  return `<div class="${cardCls} p-4 ${sel?'ring-2 ring-indigo-500':''}">
    <div class="flex items-start gap-3"><div class="text-2xl">${icon}</div>
      <div class="flex-1 min-w-0"><div class="font-semibold leading-snug">${esc(name)}</div>
      <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${n} ta savol${bad?` · <span class="text-rose-600 dark:text-rose-400">${bad} xato</span>`:''}</div></div>
      <div class="text-right"><div class="text-lg font-bold text-emerald-600 dark:text-emerald-400">${pct}%</div><div class="text-[10px] text-slate-400">o’zlashtirish</div></div></div>
    <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden my-3"><div class="h-full bg-emerald-500" style="width:${pct}%"></div></div>
    <div class="grid grid-cols-2 gap-2 text-sm">
      <button data-act="go" data-m="fc" data-t="${id}" class="py-2 rounded-lg bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-200 font-medium hover:bg-indigo-100 dark:hover:bg-indigo-900/70">🃏 Kartochka</button>
      <button data-act="go" data-m="quiz" data-t="${id}" class="py-2 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700">✅ Test</button>
    </div></div>`;
}
function renderTopics(){
  $('#view').innerHTML=`<div class="flex items-center justify-between mb-3 gap-2 flex-wrap"><h2 class="font-bold">Mavzular bo’yicha o’qish</h2>
    <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none"><input type="checkbox" id="onlyBad2" class="accent-rose-600" ${prefs.onlyBad?'checked':''}> Faqat xato qilinganlar</label></div>
    <div class="grid sm:grid-cols-2 gap-3">${topicCard('all','📚','Barcha savollar',Q)}${topicList().map(t=>topicCard(t.c.id,t.c.icon,t.c.name,t.items)).join('')}</div>`;
  $('#onlyBad2').addEventListener('change',e=>{prefs.onlyBad=e.target.checked;savePrefs();$('#onlyBad').checked=e.target.checked});
}

function emptyOrDone(s,m){
  if(!s.total)return `<div class="${cardCls} p-8 text-center"><div class="text-4xl mb-2">🎉</div><p class="font-semibold">${prefs.onlyBad?'Bu mavzuda xato qilingan savol yo’q!':'Bu mavzuda savol yo’q.'}</p><p class="text-sm text-slate-500 mt-1">Boshqa mavzuni tanlang yoki “Faqat xatolar” ni o’chiring.</p></div>`;
  if(!s.queue.length){
    const tot=s.ok+s.bad,acc=tot?Math.round(s.ok/tot*100):0,nb=Q.filter(x=>isBad(x)&&(prefs.topic==='all'||x.cats.includes(prefs.topic))).length;
    return `<div class="${cardCls} p-8 text-center"><div class="text-4xl mb-2">🏁</div><h2 class="text-xl font-bold mb-1">Sessiya yakunlandi</h2>
    <p class="text-slate-500 dark:text-slate-400 mb-4">${m==='fc'?`Bildim: ${s.ok} · Bilmadim: ${s.bad}`:`To’g’ri: ${s.ok} · Xato: ${s.bad}`} · Aniqlik: <b class="text-indigo-600 dark:text-indigo-400">${acc}%</b></p>
    <div class="flex justify-center gap-2 flex-wrap"><button data-act="restart" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-medium">Yangidan boshlash</button>${nb?`<button data-act="wrongs" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-medium">Xatolar ustida ishlash (${nb})</button>`:''}<button data-mode="topics" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600">Mavzular</button></div></div>`;
  }
  return null;
}
function badge(q){return `<div class="flex flex-wrap gap-1 justify-center">`+q.cats.map(id=>{const c=CatBy[id];return `<span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${c.icon} ${esc(c.name)}</span>`}).join('')+`</div>`}

function renderFC(){
  const s=S.fc;const e=emptyOrDone(s,'fc');
  if(e){$('#view').innerHTML=e;return}
  const q=ById[s.queue[0]];
  $('#view').innerHTML=`
  <div class="flip cursor-pointer" data-act="flip"><div class="flip-inner ${s.flipped?'is-flipped':''}" id="flipInner">
    <div class="face front ${cardCls} p-6 sm:p-10 min-h-[280px] flex flex-col items-center justify-center text-center gap-3">
      ${badge(q)}<p class="text-lg sm:text-xl font-semibold leading-relaxed">${esc(q.q)}</p>
      <p class="text-xs text-slate-400 mt-2">Javobni ko’rish uchun bosing (Space)</p></div>
    <div class="face back rounded-2xl border border-emerald-300 dark:border-emerald-700 bg-emerald-50 dark:bg-emerald-900/30 shadow-sm p-6 sm:p-10 min-h-[280px] flex flex-col items-center justify-center text-center">
      <span class="text-xs uppercase tracking-wide text-emerald-600 dark:text-emerald-400 mb-3">To’g’ri javob</span>
      <p class="text-lg sm:text-xl font-semibold leading-relaxed">${esc(q.opts[q.c])}</p></div>
  </div></div>
  <div class="grid grid-cols-2 gap-3 mt-4">
    <button data-act="dont" id="btnDont" class="py-3 rounded-xl bg-rose-600 text-white font-semibold hover:bg-rose-700 disabled:opacity-40" ${s.flipped?'':'disabled'}>✗ Bilmadim</button>
    <button data-act="know" id="btnKnow" class="py-3 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 disabled:opacity-40" ${s.flipped?'':'disabled'}>✓ Bildim</button></div>
  <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-3">Qolgan: ${s.queue.length}. “Bilmadim” kartochka tez orada qayta chiqadi. Klaviatura: Space, ←, →</p>`;
}
function renderQuiz(){
  const s=S.quiz;const e=emptyOrDone(s,'quiz');
  if(e){$('#view').innerHTML=e;return}
  const q=ById[s.queue[0]],L='ABCD',ans=s.sel!==null;
  const opts=s.order.map((oi,di)=>{
    let cls='border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-indigo-400',mark='';
    if(ans){
      if(oi===q.c){cls='border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-900 dark:text-emerald-100';mark='✓'}
      else if(di===s.sel){cls='border-rose-500 bg-rose-50 dark:bg-rose-900/30 text-rose-900 dark:text-rose-100';mark='✗'}
      else cls='border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 opacity-60';
    }
    return `<button data-act="pick" data-i="${di}" ${ans?'disabled':''} class="w-full text-left flex items-start gap-3 p-3.5 rounded-xl border-2 transition ${cls}">
      <span class="shrink-0 w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 text-sm font-bold flex items-center justify-center">${L[di]||di+1}</span>
      <span class="flex-1 pt-0.5">${esc(q.opts[oi])}</span><span class="font-bold">${mark}</span></button>`;
  }).join('');
  const ok=ans&&s.order[s.sel]===q.c;
  $('#view').innerHTML=`
  <div class="${cardCls} p-5 sm:p-6 mb-3"><div class="flex justify-between items-center mb-1"><span class="text-xs uppercase tracking-wide text-indigo-500">Savol ${s.done+(ans?0:1)} / ${s.total}</span>${badge(q)}</div>
    <p class="text-lg font-semibold leading-relaxed">${esc(q.q)}</p></div>
  <div class="space-y-2">${opts}</div>
  ${ans?`<div class="mt-4 flex items-center justify-between gap-3"><span class="font-semibold ${ok?'text-emerald-600 dark:text-emerald-400':'text-rose-600 dark:text-rose-400'}">${ok?'To’g’ri! 🎉':'Noto’g’ri — to’g’ri javob yashil rangda'}</span><button data-act="next" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Keyingi →</button></div>`:`<p class="text-xs text-slate-400 mt-3 text-center">Klaviatura: 1–4 — tanlash, Enter — keyingi</p>`}`;
}

/* actions */
function setMode(m){prefs.mode=m;savePrefs();if(m!=='topics'&&!S[m])start(m);render()}
function actFlip(){const s=S.fc;if(!s||!s.queue.length)return;s.flipped=!s.flipped;$('#flipInner').classList.toggle('is-flipped',s.flipped);$('#btnDont').disabled=$('#btnKnow').disabled=!s.flipped}
function actKnow(dont){
  const s=S.fc;if(!s||!s.queue.length||!s.flipped)return;
  const id=s.queue.shift();
  if(dont){s.bad++;record(id,false);s.queue.splice(Math.min(s.queue.length,3+Math.floor(Math.random()*3)),0,id)}
  else{s.ok++;s.done++;record(id,true)}
  s.flipped=false;render();
}
function actPick(di){
  const s=S.quiz;if(!s||!s.queue.length||s.sel!==null)return;
  const q=ById[s.queue[0]];s.sel=di;const ok=s.order[di]===q.c;
  record(q.id,ok);ok?s.ok++:s.bad++;s.done++;render();
}
function actNext(){const s=S.quiz;if(!s||s.sel===null)return;s.queue.shift();s.sel=null;prepQ(s);render()}
function restartAll(){S.fc=S.quiz=null;if(prefs.mode!=='topics')start(prefs.mode)}

function updImp(){
  const t=$('#impText').value;if(!t.trim()){$('#impInfo').textContent='Matn kiritilmagan.';return}
  const r=parse(t);$('#impInfo').innerHTML=`<b class="text-emerald-600">${r.list.length}</b> ta savol topildi`+(r.skipped?`, <b class="text-rose-600">${r.skipped}</b> tasi noto’g’ri formatda`:'');
}
function doImport(){
  const r=parse($('#impText').value);if(!r.list.length){alert('Yaroqli savol topilmadi.');return}
  let list=r.list;if(document.querySelector('input[name=impMode]:checked').value==='append'){const seen=new Set(Q.map(x=>x.id));list=Q.concat(r.list.filter(x=>!seen.has(x.id)))}
  setQ(list);restartAll();$('#impText').value='';$('#modal').classList.add('hidden');render();
}

document.addEventListener('click',e=>{
  const mt=e.target.closest('[data-mode]');if(mt){setMode(mt.dataset.mode);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,m=prefs.mode;
  if(a==='flip')actFlip();
  else if(a==='know')actKnow(false);
  else if(a==='dont')actKnow(true);
  else if(a==='pick')actPick(+el.dataset.i);
  else if(a==='next')actNext();
  else if(a==='go'){prefs.mode=el.dataset.m;start(el.dataset.m,el.dataset.t);savePrefs();render();window.scrollTo(0,0)}
  else if(a==='restart'){start(m);render()}
  else if(a==='wrongs'){prefs.onlyBad=true;savePrefs();start(m);render()}
  else if(a==='reset'){if(confirm('Barcha o’rganish progressi o’chirilsinmi?')){stats={};save();restartAll();render()}}
  else if(a==='theme'){prefs.theme=document.documentElement.classList.contains('dark')?'light':'dark';savePrefs();applyTheme()}
  else if(a==='import'){$('#modal').classList.remove('hidden');updImp()}
  else if(a==='closeModal')$('#modal').classList.add('hidden');
  else if(a==='doImport')doImport();
  else if(a==='defaults'){if(confirm('Standart savollarga qaytilsinmi?')){setQ(parse($('#defaultData').textContent).list);restartAll();$('#modal').classList.add('hidden');render()}}
});
$('#topicSel').addEventListener('change',e=>{prefs.topic=e.target.value;savePrefs();start(prefs.mode);render()});
$('#onlyBad').addEventListener('change',e=>{prefs.onlyBad=e.target.checked;savePrefs();start(prefs.mode);render()});
$('#rnd').addEventListener('change',e=>{prefs.random=e.target.checked;savePrefs()});
$('#impText').addEventListener('input',updImp);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.add('hidden')});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!$('#modal').classList.contains('hidden'))return;
  const m=prefs.mode;
  if(m==='fc'){if(e.key===' '||e.key==='Enter'){e.preventDefault();actFlip()}else if(e.key==='ArrowRight')actKnow(false);else if(e.key==='ArrowLeft')actKnow(true)}
  else if(m==='quiz'){if('1234'.includes(e.key)&&e.key)actPick(+e.key-1);else if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();actNext()}}
});

(function init(){
  Object.assign(prefs,LS.get('kq_prefs',{}));
  if(!['topics','fc','quiz'].includes(prefs.mode))prefs.mode='topics';
  stats=LS.get('kq_stats',{});
  const d=LS.get('kq_data',null);
  setQ(d&&d.length?d.map(x=>mk(x.q,x.o,x.c)):parse($('#defaultData').textContent).list);
  applyTheme();
  if(prefs.mode!=='topics')start(prefs.mode);
  render();
})();
</script>
